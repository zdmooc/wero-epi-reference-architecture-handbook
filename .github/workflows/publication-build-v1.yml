name: publication-build-v1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publication-build-v1.yml

permissions:
  contents: read

env:
  FREEZE_REF: freeze/v1.0-final-manuscript-2026-09-29
  EXPECTED_FREEZE_SHA: 357399fc7bc5dbaf48ae06d3b7e207a47c70193c

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen V1 manuscript
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FREEZE_REF }}
          fetch-depth: 1

      - name: Verify frozen commit
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "freeze_ref=$FREEZE_REF"
          echo "actual_sha=$ACTUAL_SHA"
          echo "expected_sha=$EXPECTED_FREEZE_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_FREEZE_SHA"

      - name: Setup Quarto + TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Install publication QA utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils librsvg2-bin unzip zip libxml2-utils

      - name: Render publication PDF
        run: |
          rm -rf _book publication-artifacts
          mkdir -p publication-artifacts
          set -o pipefail
          quarto render --to pdf 2>&1 | tee publication-artifacts/quarto-pdf.log
          PDF="$(find _book -maxdepth 1 -type f -name '*.pdf' | head -n1)"
          test -n "$PDF"
          cp "$PDF" publication-artifacts/wero-epi-reference-architecture-handbook-v1.0-rc1.pdf

      - name: QA publication PDF
        run: |
          set -euo pipefail
          PDF="publication-artifacts/wero-epi-reference-architecture-handbook-v1.0-rc1.pdf"
          test -s "$PDF"
          pdfinfo "$PDF" | tee publication-artifacts/pdfinfo.txt
          pdftotext -layout "$PDF" publication-artifacts/book-pdf.txt

          if grep -Eq '@fig-[0-9]{2}-[0-9]{3}|\\?\\?' publication-artifacts/book-pdf.txt; then
            echo "Unresolved reference marker detected in PDF" >&2
            exit 1
          fi

          OVERFULL=0
          if grep -E 'Overfull \\hbox|Overfull \\vbox' publication-artifacts/quarto-pdf.log > publication-artifacts/pdf-overfull.txt; then
            OVERFULL="$(wc -l < publication-artifacts/pdf-overfull.txt)"
          else
            : > publication-artifacts/pdf-overfull.txt
          fi
          test "$OVERFULL" -eq 0

          PAGES="$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')"
          SIZE="$(stat -c%s "$PDF")"
          test "$PAGES" -eq 446
          echo "pdf_pages=$PAGES" | tee publication-artifacts/publication-summary.txt
          echo "pdf_bytes=$SIZE" | tee -a publication-artifacts/publication-summary.txt
          echo "pdf_overfull_boxes=$OVERFULL" | tee -a publication-artifacts/publication-summary.txt
          echo "pdf_unresolved_xrefs=0" | tee -a publication-artifacts/publication-summary.txt

      - name: Render publication EPUB
        run: |
          set -o pipefail
          quarto render --to epub 2>&1 | tee publication-artifacts/quarto-epub.log
          EPUB="$(find _book -maxdepth 1 -type f -name '*.epub' | head -n1)"
          test -n "$EPUB"
          cp "$EPUB" publication-artifacts/wero-epi-reference-architecture-handbook-v1.0-rc1.epub

      - name: QA publication EPUB
        run: |
          set -euo pipefail
          EPUB="publication-artifacts/wero-epi-reference-architecture-handbook-v1.0-rc1.epub"
          test -s "$EPUB"
          unzip -t "$EPUB" | tee publication-artifacts/epub-unzip-test.txt

          rm -rf publication-artifacts/epub-unpacked
          mkdir -p publication-artifacts/epub-unpacked
          unzip -q "$EPUB" -d publication-artifacts/epub-unpacked

          test "$(cat publication-artifacts/epub-unpacked/mimetype)" = "application/epub+zip"

          XHTML_COUNT="$(find publication-artifacts/epub-unpacked -type f \( -name '*.xhtml' -o -name '*.html' \) | wc -l)"
          IMAGE_COUNT="$(find publication-artifacts/epub-unpacked -type f \( -name '*.svg' -o -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' \) | wc -l)"
          SVG_COUNT="$(find publication-artifacts/epub-unpacked -type f -name '*.svg' | wc -l)"

          test "$XHTML_COUNT" -ge 90
          test "$SVG_COUNT" -ge 36

          if grep -R -E '@fig-[0-9]{2}-[0-9]{3}' publication-artifacts/epub-unpacked --include='*.xhtml' --include='*.html'; then
            echo "Unresolved figure reference detected in EPUB" >&2
            exit 1
          fi

          echo "epub_xhtml_files=$XHTML_COUNT" | tee -a publication-artifacts/publication-summary.txt
          echo "epub_images=$IMAGE_COUNT" | tee -a publication-artifacts/publication-summary.txt
          echo "epub_svg_files=$SVG_COUNT" | tee -a publication-artifacts/publication-summary.txt
          echo "epub_unresolved_xrefs=0" | tee -a publication-artifacts/publication-summary.txt
          echo "freeze_sha=$EXPECTED_FREEZE_SHA" | tee -a publication-artifacts/publication-summary.txt

      - name: Generate checksums
        run: |
          cd publication-artifacts
          sha256sum             wero-epi-reference-architecture-handbook-v1.0-rc1.pdf             wero-epi-reference-architecture-handbook-v1.0-rc1.epub             > SHA256SUMS.txt

      - name: Upload V1 release-candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wero-epi-handbook-v1.0-rc1
          path: |
            publication-artifacts/wero-epi-reference-architecture-handbook-v1.0-rc1.pdf
            publication-artifacts/wero-epi-reference-architecture-handbook-v1.0-rc1.epub
            publication-artifacts/SHA256SUMS.txt
            publication-artifacts/publication-summary.txt
            publication-artifacts/pdfinfo.txt
            publication-artifacts/quarto-pdf.log
            publication-artifacts/quarto-epub.log
          retention-days: 30
          if-no-files-found: error
